name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libappindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-rpc-${{ matrix.os }}
          path: |
            target/release/ps5-rpc
            target/release/ps5-rpc.exe
          if-no-files-found: ignore

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-rpc-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/ps5-rpc.exe

  payload:
    runs-on: ubuntu-24.04
    env:
      SDK_VERSION: v0.43
      SDK_SHA256: a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb
    steps:
      - uses: actions/checkout@v4
      - name: Install the PS5 payload SDK
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 lld-18
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/$SDK_VERSION/ps5-payload-sdk.zip"
          echo "$SDK_SHA256  sdk.zip" | sha256sum -c -
          sudo unzip -q sdk.zip -d /opt
      - name: Build
        run: make -C payload PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-rpc-payload
          path: payload/ps5-rpc.elf
