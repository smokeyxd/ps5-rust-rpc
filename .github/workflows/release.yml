name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: windows-latest
            name: windows-arm64
            target: aarch64-pc-windows-msvc
          # older Ubuntu = older glibc, so the binary also runs on older distros
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libappindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Add cross target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # an ARM64 test binary can't run on the x64 runner; the x64 job runs the same tests
      - if: ${{ !matrix.target }}
        run: cargo test --all
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/ps5-rpc \
              target/aarch64-apple-darwin/release/ps5-rpc \
              target/x86_64-apple-darwin/release/ps5-rpc
            echo "BIN_DIR=target/release" >> "$GITHUB_ENV"
          elif [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
            echo "BIN_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release
            echo "BIN_DIR=target/release" >> "$GITHUB_ENV"
          fi
      - name: Package
        shell: bash
        # same names every release, so .../releases/latest/download/<name> links keep working
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$BIN_DIR/ps5-rpc.exe" "dist/ps5-rpc-${{ matrix.name }}.exe"
          else
            cp "$BIN_DIR/ps5-rpc" "dist/ps5-rpc-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  payload:
    runs-on: ubuntu-24.04
    env:
      SDK_VERSION: v0.43
      SDK_SHA256: a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb
    steps:
      - uses: actions/checkout@v4
      - name: Install the PS5 payload SDK
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 lld-18
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/$SDK_VERSION/ps5-payload-sdk.zip"
          echo "$SDK_SHA256  sdk.zip" | sha256sum -c -
          sudo unzip -q sdk.zip -d /opt
      - name: Build
        run: make -C payload PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload/ps5-rpc.elf
          if-no-files-found: error

  publish:
    needs: [build, payload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "ps5-rpc $TAG" --generate-notes --verify-tag
          fi
